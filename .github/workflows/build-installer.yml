name: Build Quickglint Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Quickglint executable
        run: python build_exe.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        run: iscc installer\Quickglint.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quickglint-Installer
          path: dist/installer/Quickglint-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/installer/Quickglint-Setup.exe `
            --title "Quickglint ${{ github.ref_name }}" `
            --generate-notes

      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest `
              dist/installer/Quickglint-Setup.exe `
              --target $env:GITHUB_SHA `
              --title "Quickglint Latest" `
              --notes "Latest automatically built Quickglint installer from the main branch."
          } else {
            gh release upload latest dist/installer/Quickglint-Setup.exe --clobber
          }

